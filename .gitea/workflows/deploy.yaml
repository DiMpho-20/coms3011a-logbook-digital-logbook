# CI/CD. Every push installs, typechecks, lints, tests and builds. A push to
# main that passes all of that then deploys: the API to Render (which applies
# any new database migrations as it starts) and the frontend to Cloudflare
# Pages. Each deploy step runs only once its secret is set, so the pipeline
# stays green before then. See "Deployment" in the setup guide.
name: CI - Test and Build

on:
  push:
    branches: [ "main", "master", "Alondwe", "Dineo" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # A database for this run only: next to the runner, so the suite is fast
    # and never writes into the shared one. Not named "postgres", which on a
    # shared runner network can already belong to another server.
    services:
      logbook-test-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logbook
          POSTGRES_PASSWORD: logbook
          POSTGRES_DB: logbook_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 30 and jest-dom 7 both require Node 22+, so pinning the
          # runner at 20 killed the frontend suite at environment setup:
          # every suite reported zero coverage rather than a test failure.
          # .nvmrc already declares the version this repository expects, so
          # the workflow reads it from there instead of keeping a second copy.
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # Must come before every typecheck, lint and build below: the backend and
      # the frontend both resolve @logbook/shared through its package.json, which
      # now points at dist. Without this step they resolve to nothing.
      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma

      - name: Typecheck backend
        run: npm run typecheck --workspace=apps/backend

      - name: Lint frontend
        run: npm run lint --workspace=apps/frontend

      # test:coverage rather than test: the v8 text reporter prints the
      # coverage table into this log, which is the visible evidence the
      # client asked for. The plain test scripts are unchanged for local use.
      #
      # Which database: the run's own one above when it comes up, with the
      # schema built from the migrations. Over the network, the shared
      # database (secret DATABASE_URL) has made the suite take 12 minutes and
      # fail on query timeouts, so it is now only the fallback, for a runner
      # that cannot start the service, and is then given fewer workers.
      # (Run from apps/backend: Prisma 7 reads the URL from prisma.config.ts.)
      - name: Choose the test database
        working-directory: apps/backend
        env:
          RUN_DB: postgresql://logbook:logbook@logbook-test-db:5432/logbook_test
          SHARED_DB: ${{ secrets.DATABASE_URL }}
        run: |
          for attempt in $(seq 1 12); do
            if DATABASE_URL="$RUN_DB" npx prisma migrate deploy; then
              echo "Backend tests use this run's own database."
              echo "DATABASE_URL=$RUN_DB" >> "$GITHUB_ENV"
              echo "TEST_WORKERS=4" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::This run's database never came up; backend tests fall back to the shared DATABASE_URL."
          echo "DATABASE_URL=$SHARED_DB" >> "$GITHUB_ENV"
          echo "TEST_WORKERS=2" >> "$GITHUB_ENV"

      # if: always() — coverage must reach the commit on every push, even one
      # whose earlier step failed; the report below needs both summaries.
      # DATABASE_URL and TEST_WORKERS come from the step above.
      - name: Run backend tests with coverage
        if: always()
        run: npm run test:coverage --workspace=apps/backend -- --maxWorkers="${TEST_WORKERS:-2}"

      # Same reasoning as the backend step: run regardless of earlier
      # failures so this summary exists for the combined figure.
      - name: Run frontend tests with coverage
        if: always()
        run: npm run test:coverage --workspace=apps/frontend

      # Gitea has no built-in coverage display, so the number is pushed to
      # the commit itself as a status. Never allowed to fail the build:
      # publishing a figure is not worth turning a green run red.
      # if: always() — vitest writes its coverage files even when tests fail
      # (reportOnFailure), so a red run still publishes the number instead of
      # leaving the commit with no coverage status at all.
      - name: Report coverage to Gitea
        if: always()
        continue-on-error: true
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .gitea/scripts/report-coverage.mjs

      # BUG-004, BUG-005, BUG-006: fixed and regression-tested. Posted on
      # the run summary and echoed into the log; static facts, so a heredoc
      # rather than a script, and if: always() so even a red run carries the
      # record.
      - name: "Fixed: BUG-004, BUG-005, BUG-006 (2FA security hardening)"
        if: always()
        run: |
          note="$(mktemp)"
          cat > "$note" <<'EOF'
          ## Fixed: BUG-004, BUG-005, BUG-006 (2FA security hardening)

          The three 2FA authentication bugs found in the Sprint 2 security review are fixed, merged to `main`, and locked in by regression tests that run in this job's backend suite:

          | Bug | Fixed in | What the fix does | Regression tests |
          |---|---|---|---|
          | BUG-004 — TOTP secrets stored unencrypted | `acdcf58` | Secrets are stored as AES-256-GCM envelopes (`v1.<iv>.<tag>.<ciphertext>`) under `TWO_FACTOR_ENCRYPTION_KEY`; setup returns 503 rather than store plaintext without the key | `authCrypto.test.ts` — 28 tests |
          | BUG-005 — No 2FA recovery codes | `acdcf58` + `74dfa9f` | Ten single-use recovery codes, issued exactly once at enable, stored as SHA-256 digests and spent atomically; regeneration is password-gated and invalidates every earlier code | `twoFactorSecurity.test.ts` — 21 tests |
          | BUG-006 — 2FA login steps not cryptographically linked | `acdcf58` | Step 1 issues a five-minute purpose-scoped `2fa-pending` hand-off token; step 2 identifies the account solely by that token, and the auth middleware refuses it as a session | `twoFactorSecurity.test.ts` — refusal cases |

          Full write-ups with reproduction steps: `.gitea/issues/BUG-004-unencrypted-totp-secrets.md`, `.gitea/issues/BUG-005-no-2fa-recovery-codes.md` and `.gitea/issues/BUG-006-2fa-steps-not-linked.md`. Design rationale: `apps/backend/AUTHENTICATION.md`.
          EOF
          cat "$note" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          cat "$note"
          rm -f "$note"

      # Pinned to v3: v4 of this action needs an artifact backend that Gitea
      # runners do not all provide. continue-on-error keeps a runner without
      # artifact storage from failing an otherwise green build — the numbers
      # are already in the log above either way. Also runs on red builds,
      # where the lcov files are most useful for diagnosis.
      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        if: always()
        continue-on-error: true
        with:
          name: coverage-lcov
          if-no-files-found: warn
          path: |
            apps/backend/coverage/lcov.info
            apps/frontend/coverage/lcov.info

      - name: Build Backend
        run: npm run build --workspace=apps/backend

      - name: Build Frontend
        run: npm run build --workspace=apps/frontend

  # ── CD: deploy main once everything above has passed ──────────────────────
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'coms3011a-logbook' }}
    steps:
      # Render rebuilds the API from main; the container runs any pending
      # migrations before it starts serving (apps/backend "start:deploy").
      - name: Deploy API to Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Checkout code
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Build frontend
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci
          npm run build --workspace=packages/shared
          npm run build --workspace=apps/frontend

      - name: Deploy frontend to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy apps/frontend/dist --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main

      # The free tier sleeps; after a deploy, wake it so the first visitor
      # isn't the one who waits.
      - name: Wake the API
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          for i in $(seq 1 20); do
            curl -fsS --max-time 30 https://digital-logbook-backend-latest.onrender.com/api/health && exit 0
            sleep 15
          done
          echo "The API did not answer yet; Render may still be building."
