name: Build and Push Backend Application

on:
  push:
    branches: [ "main", "master", "Alondwe", "Dineo" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma

      - name: Typecheck backend
        run: npm run typecheck --workspace=apps/backend

      - name: Lint frontend
        run: npm run lint --workspace=apps/frontend

      - name: Run backend tests
        run: npm test --workspace=apps/backend

      - name: Run frontend tests
        run: npm test --workspace=apps/frontend

      - name: Build Backend
        run: npm run build --workspace=apps/backend

      - name: Build Frontend
        run: npm run build --workspace=apps/frontend