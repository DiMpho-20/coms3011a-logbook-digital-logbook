# trigger reset
name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master", "Alondwe" ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build local TypeScript code
        run: |
          npm ci
          npx prisma generate --schema=apps/backend/prisma/schema.prisma
          npm run build --workspace=apps/backend
# build trigger
