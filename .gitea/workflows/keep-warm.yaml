# Render's free tier puts the API to sleep after a quiet spell, and the first
# request then waits up to a minute while it wakes. Asking for /api/health
# every ten minutes keeps it awake, so nobody (a user, or a marker) meets
# that wait. It only reads the health check; it changes nothing.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API's health check
        run: curl -fsS --max-time 90 https://digital-logbook-backend-latest.onrender.com/api/health
