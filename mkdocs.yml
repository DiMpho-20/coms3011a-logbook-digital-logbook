site_name: Digital Logbook Documentation
site_description: Technical documentation and architecture for the Digital Logbook project.
site_url: https://digital-logbook-docs.pages.dev

# Internal working notes that must not be published
exclude_docs: |
  feature-audit-2026-09.md

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Setup Guide: setup.md
  - System Architecture: architecture.md
  - Methodology: methodology.md
  - Client Interactions: client-interactions.md
  - API Reference: api-reference.md
  - Testing: testing.md
  - Testing Quickstart: testing-quickstart.md
  - User Feedback: user-feedback.md
  - Third-Party Code: third-party.md
  - User Stories: user-stories/user-stories.md
  - Extra Features:
      - Overview: extra-features/README.md
      - AI Help Assistant: extra-features/ai-help-assistant.md
      - My Grades: extra-features/my-grades.md
      - Google Calendar Sync: extra-features/google-calendar-sync.md
  - Design: design/architecture.md
  - Database design: design/database-erd.md
  - UI Design: design/ui-design.md
  - Development Plan: design/development-plan.md
  - Roadmap: design/roadmap.md
  - System Design: design/system-design.md
 