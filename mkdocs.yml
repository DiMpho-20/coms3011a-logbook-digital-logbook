site_name: Digital Logbook Documentation
site_description: Technical documentation and architecture for the Digital Logbook project.
site_url: https://no-boys-just-bugs-digital-logbook-doc.netlify.app/

# Internal working notes that must not be published
exclude_docs: |
  project/audits/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Setup Guide: setup.md
  - Architecture:
      - Overview: architecture/overview.md
      - Authentication Analysis: architecture/authentication.md
  - API Reference: api/reference.md
  - Testing:
      - Strategy: testing/strategy.md
      - Quickstart: testing/quickstart.md
  - Project:
      - Methodology: project/methodology.md
      - Client Interactions: project/client-interactions.md
      - User Stories: project/user-stories.md
      - User Feedback: project/feedback/user-feedback.md
      - Third-Party Code: project/third-party.md
  - Design:
      - Architecture Design: design/architecture.md
      - System Design: design/system-design.md
      - Database Design: design/database-erd.md
      - UI Design: design/ui-design.md
      - Development Plan: design/development-plan.md
      - Roadmap: design/roadmap.md
  - Extra Features:
      - Overview: extra-features/index.md
      - AI Help Assistant: extra-features/ai-help-assistant.md
      - My Grades: extra-features/my-grades.md
      - Google Calendar Sync: extra-features/google-calendar-sync.md
 