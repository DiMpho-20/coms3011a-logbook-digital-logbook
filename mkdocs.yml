site_name: Digital Logbook Documentation
site_description: Technical documentation and architecture for the Digital Logbook project.
site_url: https://digital-logbook-docs.pages.dev

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Setup Guide: setup.md
  - System Architecture: architecture.md
  - Methodology: methodology.md
  - Client Interactions: client-interactions.md
  - User Stories: user-stories/user-stories.md
  - Design: design/architecture.md
  - System Architecture: architecture.md
  - Database design: design/database-erd.md
  - UI Design: design/ui-design.md
  - Development Plan: design/development-plan.md
  - Roadmap: design/roadmap.md
  - System Design: design/system-design.md
 