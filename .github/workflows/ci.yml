# Every push to main and every pull request is installed, typechecked, linted,
# tested against a real database, and built. This is the GitHub counterpart to
# .gitea/workflows/deploy.yaml and keeps the same step order, because
# packages/shared must be built before either app can resolve it through dist.
#
# A push to main that passes all of the above then deploys: the API is
# restarted through a Render deploy hook, and the frontend bundle this run
# built and tested is published to Cloudflare Pages. Each deploy step is gated
# on its own secret, and the deploy job's last step states which targets
# actually published — a green run without those secrets has deployed nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch cancels the run it supersedes, so the
# result shown is always for the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The backend suites drive the real Prisma client, so they need a migrated
    # Postgres rather than a mock. The container is this run's own and is
    # discarded with it; nothing is ever written to a shared database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logbook
          POSTGRES_PASSWORD: logbook
          POSTGRES_DB: logbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logbook -d logbook_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # prisma.config.ts reads DIRECT_URL first and falls back to DATABASE_URL;
      # setting both keeps `migrate deploy` and the app on the same connection.
      DATABASE_URL: postgresql://logbook:logbook@127.0.0.1:5432/logbook_test
      DIRECT_URL: postgresql://logbook:logbook@127.0.0.1:5432/logbook_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth. jsdom 30 needs 22.22.2 and
          # ESLint 10 needs 20.19, so a hardcoded 20 here would fail at setup.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Before every typecheck, lint and build below: both apps resolve
      # @logbook/shared through its package.json, which points at dist.
      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma

      # Run from apps/backend: Prisma 7 reads the URL from prisma.config.ts,
      # which lives there.
      - name: Apply migrations to the CI database
        working-directory: apps/backend
        run: npx prisma migrate deploy

      - name: Typecheck backend
        run: npm run typecheck --workspace=apps/backend

      # Root lint forwards to every workspace with a lint script: ESLint for
      # the backend, oxlint for the frontend.
      - name: Lint backend and frontend
        run: npm run lint

      # test:coverage rather than test: the v8 text reporter prints the table
      # into this log, and both suites fail on their configured line floor
      # (backend 80, frontend 78).
      - name: Backend tests with coverage
        run: npm run test:coverage --workspace=apps/backend

      - name: Frontend tests with coverage
        run: npm run test:coverage --workspace=apps/frontend

      # Publishing the numbers is not worth failing a run for, and the step
      # below is still useful on a red run, where the lcov files diagnose the
      # failure. if: always() so a failed suite still produces a table.
      - name: Summarise coverage
        if: always()
        continue-on-error: true
        run: node .github/scripts/coverage-summary.mjs

      - name: Upload coverage reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/backend/coverage/lcov.info
            apps/frontend/coverage/lcov.info

      - name: Build backend
        run: npm run build --workspace=apps/backend

      - name: Build frontend
        run: npm run build --workspace=apps/frontend

      # Handed to the deploy job so it publishes exactly the bundle these
      # tests ran against, rather than rebuilding the same commit a second
      # time and hoping the two match. Only main deploys, so only main uploads.
      - name: Upload frontend build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          if-no-files-found: error
          retention-days: 3
          path: apps/frontend/dist

  # ── CD: deploy main once the job above has passed ─────────────────────────
  # workflow_dispatch on main also reaches here, so a redeploy needs no commit.
  # A second push cancels the run it supersedes (concurrency above), so the
  # deploy that finishes is always the one for the newest commit.
  deploy:
    name: Deploy API and frontend
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Read through env in each step's if:, because the secrets context is not
      # available to conditionals. Each is empty when the secret is unset.
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'coms3011a-logbook' }}

    steps:
      # Render rebuilds the API from main; the container runs any pending
      # migrations before it serves (apps/backend "start:deploy").
      - name: Deploy API to Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      # Both are required: wrangler authenticates with the token and targets
      # the account with the ID, so one without the other only fails later.
      - name: Download tested frontend build
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

      # --branch=main keeps the deployment on the project's production branch.
      - name: Deploy frontend to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >-
          npx --yes wrangler@3 pages deploy apps/frontend/dist
          --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main

      # The free tier sleeps; after a deploy, wake it so the first visitor
      # isn't the one who waits.
      - name: Wake the API
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          for i in $(seq 1 20); do
            curl -fsS --max-time 30 https://digital-logbook-backend-latest.onrender.com/api/health && exit 0
            sleep 15
          done
          echo "The API did not answer yet; Render may still be building."

      # A skipped deploy step leaves the run green, which is exactly the
      # reading that misled the 2026-11-25 audit. This states the outcome on
      # the run page, and also runs when an earlier deploy step failed.
      - name: State what this run deployed
        if: always()
        run: |
          {
            echo "## Deploy"
            if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
              echo "- **API:** deploy hook called; Render restarts the service and migrates on start."
            else
              echo "- **API:** skipped — RENDER_DEPLOY_HOOK_URL is not set in this repository."
            fi
            if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
              echo "- **Frontend:** published to Cloudflare Pages project $CLOUDFLARE_PAGES_PROJECT."
            else
              echo "- **Frontend:** skipped — CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set in this repository."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
